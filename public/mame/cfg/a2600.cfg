<?xml version="1.0"?>
<!-- The Atari 2600's settings in MAME (README.md beside this): the right-hand joystick moved with the arrows, as the left-hand one is. -->
<mameconfig version="10">
    <system name="a2600">
        <input>
            <port tag=":joyport2:joy:JOY" type="P2_JOYSTICK_UP" mask="1" defvalue="1">
                <newseq type="standard">KEYCODE_UP</newseq>
            </port>
            <port tag=":joyport2:joy:JOY" type="P2_JOYSTICK_DOWN" mask="2" defvalue="2">
                <newseq type="standard">KEYCODE_DOWN</newseq>
            </port>
            <port tag=":joyport2:joy:JOY" type="P2_JOYSTICK_LEFT" mask="4" defvalue="4">
                <newseq type="standard">KEYCODE_LEFT</newseq>
            </port>
            <port tag=":joyport2:joy:JOY" type="P2_JOYSTICK_RIGHT" mask="8" defvalue="8">
                <newseq type="standard">KEYCODE_RIGHT</newseq>
            </port>
        </input>
    </system>
</mameconfig>
